# Orchestrator for Orbit Agent services (restructured monorepo)
# - redis: cache / queue backend
# - browser: Playwright WebSocket server
# - api-dev: FastAPI agent platform (development mode with hot reload)
#
# Required env (create .env at project root):
#   SUPABASE_URL=...
#   SUPABASE_ANON_KEY=...
# Optional env:
#   PLAYWRIGHT_PORT=3500
#   PUBLIC_HOST=browser
#   API_PORT=5000

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - orbit

  browser:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.browser
    environment:
      - PLAYWRIGHT_PORT=3500
      - PUBLIC_HOST=browser
    ports:
      - "3500:3500"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "test -s ${WS_ENDPOINT_FILE:-/var/run/playwright-ws-endpoint}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - orbit

  # Development variant with hot reload and bind mounts
  api-dev:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    depends_on:
      redis:
        condition: service_healthy
      browser:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379
      - BROWSER_WSS_URL=ws://browser:3500
      - IN_DOCKER=true
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      # Mount both packages for hot reload
      - ./packages/orbit-core:/app/packages/orbit-core
      - ./packages/orbit-api:/app/packages/orbit-api
    command: [
      "uvicorn", "agent_platform.app.api.main:app",
      "--host", "0.0.0.0",
      "--port", "5000",
      "--reload",
      "--reload-dir", "/app/packages/orbit-api",
      "--reload-dir", "/app/packages/orbit-core"
    ]
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - orbit
    profiles:
      - dev

networks:
  orbit:
    driver: bridge
