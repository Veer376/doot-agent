services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - orbit

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=orbit_agent
      - POSTGRES_USER=orbit
      - POSTGRES_PASSWORD=orbit_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - orbit

  # browser:
  #   build:
  #     context: .
  #     dockerfile: packages/browser/Dockerfile
  #   environment:
  #     - PLAYWRIGHT_PORT=3500
  #     - PUBLIC_HOST=browser
  #   ports:
  #     - "3500:3500"
  #   shm_size: "1gb"
  #   healthcheck:
  #     test: ["CMD-SHELL", "test -s ${WS_ENDPOINT_FILE:-/var/run/playwright-ws-endpoint}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 30
  #   restart: unless-stopped
  #   networks:
  #     - orbit

  # Development variant with hot reload and bind mounts
  api-dev:
    build:
      context: .
      dockerfile: packages/agent-platform/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # browser:
      #   condition: service_healthy
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://orbit:orbit_dev_password@postgres:5432/orbit_agent
      - BROWSER_WSS_URL=ws://browser:3500/
      - IN_DOCKER=true
      - WATCHFILES_FORCE_POLLING=true
      - ORBIT_AGENT_ROOT=/app
    volumes:
      # Mount both packages for hot reload
      - ./packages/orbit-core:/app/packages/orbit-core
      - ./packages/agent-platform:/app/packages/agent-platform
      # Mount langgraph.json from repo root
      - ./langgraph.json:/app/langgraph.json
    command: ["uvicorn", "agent_platform.api.main:app", "--host", "0.0.0.0", "--port", "5000", "--reload", "--reload-dir", "/app/packages/agent-platform", "--reload-dir", "/app/packages/orbit-core"]
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - orbit

networks:
  orbit:
    driver: bridge

volumes:
  postgres_data:
