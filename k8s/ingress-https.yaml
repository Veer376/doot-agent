apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-platform-ingress
  namespace: doot-agent
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "agent-platform-ip"
    networking.gke.io/managed-certificates: "agent-platform-cert"
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
  - host: YOUR_DOMAIN_HERE  # Replace with your domain (e.g., api.yourdomain.com)
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: agent-platform
            port:
              number: 5000
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: agent-platform-cert
  namespace: doot-agent
spec:
  domains:
    - YOUR_DOMAIN_HERE  # Replace with your domain
