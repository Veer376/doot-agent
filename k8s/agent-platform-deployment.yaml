apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform
  namespace: doot-agent
  labels:
    app: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-platform
  template:
    metadata:
      labels:
        app: agent-platform
    spec:
      serviceAccountName: agent-platform
      containers:
      - name: agent-platform
        image: us-central1-docker.pkg.dev/doot-agent/doot-agent-repo/agent-platform:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: ORBIT_AGENT_ROOT
          value: "/app"
        - name: IN_DOCKER
          value: "true"
        - name: ENV_MODE
          value: "production"
        - name: BROWSER_WSS_URL
          value: "ws://browser-manager.doot-agent.svc.cluster.local:8000"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: agent-platform-config
              key: REDIS_URL
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: agent-platform-config
              key: POSTGRES_URL
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: agent-platform-config
              key: SUPABASE_URL
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: agent-platform-config
              key: SUPABASE_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-platform
  namespace: doot-agent
spec:
  selector:
    app: agent-platform
  ports:
  - port: 5000
    targetPort: 5000
  type: LoadBalancer
