apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-manager
  namespace: doot-agent
  labels:
    app: browser-manager
    component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: browser-manager
  template:
    metadata:
      labels:
        app: browser-manager
        component: control-plane
    spec:
      serviceAccountName: browser-manager
      containers:
      - name: browser-manager
        image: us-central1-docker.pkg.dev/doot-agent/doot-agent-repo/browser-manager:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: BROWSER_IMAGE
          valueFrom:
            secretKeyRef:
              name: browser-manager-config
              key: BROWSER_IMAGE
        - name: GCP_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: browser-manager-config
              key: GCP_PROJECT_ID
        - name: MAX_BROWSERS
          valueFrom:
            secretKeyRef:
              name: browser-manager-config
              key: MAX_BROWSERS
        - name: ENVIRONMENT
          valueFrom:
            secretKeyRef:
              name: browser-manager-config
              key: ENVIRONMENT
        - name: BROWSER_MANAGER_NAMESPACE
          value: "doot-agent"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: browser-manager
  namespace: doot-agent
  labels:
    app: browser-manager
spec:
  selector:
    app: browser-manager
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None
