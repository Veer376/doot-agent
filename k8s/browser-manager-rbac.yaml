# This YAML file defines the RBAC (Role-Based Access Control) configuration for the Browser Manager component in the Orbit Agent Kubernetes cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: browser-manager
  namespace: doot-agent
  annotations:
    # Workload Identity: allows pod to authenticate as GCP service account
    iam.gke.io/gcp-service-account: browser-manager-sa@doot-agent.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: browser-manager-role
  namespace: doot-agent
rules:
# Permission to manage browser pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "delete", "get", "list", "watch", "patch"]
# Permission to read pod logs (for debugging)
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Permission to read services (to get pod IPs)
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: browser-manager-binding
  namespace: doot-agent
subjects:
- kind: ServiceAccount
  name: browser-manager
  namespace: doot-agent
roleRef:
  kind: Role
  name: browser-manager-role
  apiGroup: rbac.authorization.k8s.io
