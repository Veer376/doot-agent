apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-platform
  namespace: doot-agent
  annotations:
    iam.gke.io/gcp-service-account: agent-platform-sa@doot-agent.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-platform
  namespace: doot-agent
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-platform
  namespace: doot-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-platform
subjects:
- kind: ServiceAccount
  name: agent-platform
  namespace: doot-agent
