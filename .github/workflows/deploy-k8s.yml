name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'packages/agent-platform/**'
      - 'packages/browser/**'
      - 'packages/browser-manager/**'
      - 'packages/orbit-core/**'
      - 'k8s/**'
      - '.github/workflows/deploy-k8s.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, agent-platform, browser, browser-manager)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - agent-platform
          - browser
          - browser-manager

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  REGISTRY: ${{ secrets.GCP_REGISTRY }}
  REPOSITORY: doot-agent-repo

jobs:
  # Job 1: Build browser-manager image
  build-browser-manager:
    name: Build Browser Manager Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event.inputs.service == 'all' || 
      github.event.inputs.service == 'browser-manager'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and Push Browser Manager Image
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/browser-manager:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/browser-manager:latest"
          
          # Build image
          docker build \
            -f packages/browser-manager/Dockerfile \
            -t $IMAGE_NAME \
            -t $IMAGE_LATEST \
            packages/browser-manager
          
          # Push both tags
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST
          
          echo "browser_manager_image=$IMAGE_NAME" >> $GITHUB_OUTPUT
        id: build

      - name: Save image name
        run: |
          echo "${{ steps.build.outputs.browser_manager_image }}" > browser-manager-image.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-manager-image
          path: browser-manager-image.txt

  # Job 2: Build agent-platform image
  build-agent-platform:
    name: Build Agent Platform Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event.inputs.service == 'all' || 
      github.event.inputs.service == 'agent-platform'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and Push Agent Platform Image
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/agent-platform:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/agent-platform:latest"
          
          docker build \
            -f packages/agent-platform/Dockerfile \
            -t $IMAGE_NAME \
            -t $IMAGE_LATEST \
            .
          
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST

  # Job 3: Build browser image
  build-browser:
    name: Build Browser Service Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event.inputs.service == 'all' || 
      github.event.inputs.service == 'browser'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and Push Browser Image
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/browser:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/browser:latest"
          
          docker build \
            -f packages/browser/Dockerfile \
            -t $IMAGE_NAME \
            -t $IMAGE_LATEST \
            .
          
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST

  # Job 4: Deploy to Kubernetes
  deploy-to-k8s:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: [build-browser-manager, build-agent-platform, build-browser]
    if: always() && (needs.build-browser-manager.result == 'success' || needs.build-agent-platform.result == 'success' || needs.build-browser.result == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Verify kubectl connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply namespace
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Namespace
          metadata:
            name: doot-agent
            labels:
              name: doot-agent
          EOF

      - name: Apply browser-manager RBAC
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: browser-manager
            namespace: doot-agent
            annotations:
              iam.gke.io/gcp-service-account: browser-manager-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: browser-manager
            namespace: doot-agent
          rules:
          - apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch", "create", "delete"]
          - apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get", "list"]
          - apiGroups: [""]
            resources: ["pods/exec"]
            verbs: ["create"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: browser-manager
            namespace: doot-agent
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: browser-manager
          subjects:
          - kind: ServiceAccount
            name: browser-manager
            namespace: doot-agent
          EOF

      - name: Apply browser-manager config
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: browser-manager-config
            namespace: doot-agent
          type: Opaque
          stringData:
            BROWSER_IMAGE: "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/browser:latest"
            GCP_PROJECT_ID: "${{ env.PROJECT_ID }}"
            MAX_BROWSERS: "20"
            ENVIRONMENT: "production"
          EOF

      - name: Deploy browser-manager
        if: |
          needs.build-browser-manager.result == 'success' &&
          (github.event.inputs.service == 'all' || 
           github.event.inputs.service == 'browser-manager' ||
           github.event_name == 'push')
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: browser-manager
            namespace: doot-agent
            labels:
              app: browser-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: browser-manager
            template:
              metadata:
                labels:
                  app: browser-manager
              spec:
                serviceAccountName: browser-manager
                containers:
                - name: browser-manager
                  image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/browser-manager:${{ github.sha }}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 8000
                  env:
                  - name: BROWSER_IMAGE
                    valueFrom:
                      secretKeyRef:
                        name: browser-manager-config
                        key: BROWSER_IMAGE
                  - name: GCP_PROJECT_ID
                    valueFrom:
                      secretKeyRef:
                        name: browser-manager-config
                        key: GCP_PROJECT_ID
                  - name: MAX_BROWSERS
                    valueFrom:
                      secretKeyRef:
                        name: browser-manager-config
                        key: MAX_BROWSERS
                  - name: ENVIRONMENT
                    valueFrom:
                      secretKeyRef:
                        name: browser-manager-config
                        key: ENVIRONMENT
                  - name: BROWSER_MANAGER_NAMESPACE
                    value: "doot-agent"
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 10
                    periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: browser-manager
            namespace: doot-agent
          spec:
            selector:
              app: browser-manager
            ports:
            - port: 8000
              targetPort: 8000
            type: LoadBalancer
          EOF
          
          echo "⏳ Waiting for browser-manager deployment (timeout: 10m)..."
          if ! kubectl rollout status deployment/browser-manager -n doot-agent --timeout=10m; then
            echo "❌ Deployment failed! Checking pod status..."
            kubectl get pods -n doot-agent -l app=browser-manager
            echo ""
            echo "Pod logs:"
            kubectl logs -n doot-agent -l app=browser-manager --tail=100 || true
            echo ""
            echo "Pod events:"
            kubectl describe pods -n doot-agent -l app=browser-manager || true
            exit 1
          fi
          echo "✅ Browser-manager deployed successfully"
          
          # Get service URL immediately
          echo ""
          echo "🌐 Getting browser-manager URL..."
          for i in {1..30}; do
            BROWSER_IP=$(kubectl get service browser-manager -n doot-agent -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$BROWSER_IP" ]; then
              echo "✅ Browser Manager API: http://$BROWSER_IP:8000"
              echo "   Health: http://$BROWSER_IP:8000/health"
              echo "   Docs: http://$BROWSER_IP:8000/docs"
              break
            fi
            echo "   Waiting for external IP... ($i/30)"
            sleep 2
          done

      - name: Apply agent-platform RBAC
        if: |
          needs.build-agent-platform.result == 'success' &&
          (github.event.inputs.service == 'all' || 
           github.event.inputs.service == 'agent-platform' ||
           github.event_name == 'push')
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: agent-platform
            namespace: doot-agent
            annotations:
              iam.gke.io/gcp-service-account: agent-platform-sa@doot-agent.iam.gserviceaccount.com
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: agent-platform
            namespace: doot-agent
          rules:
          - apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch"]
          - apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get", "list"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: agent-platform
            namespace: doot-agent
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: agent-platform
          subjects:
          - kind: ServiceAccount
            name: agent-platform
            namespace: doot-agent
          EOF

      - name: Sync GCP Secrets to K8s
        if: |
          needs.build-agent-platform.result == 'success' &&
          (github.event.inputs.service == 'all' || 
           github.event.inputs.service == 'agent-platform' ||
           github.event_name == 'push')
        run: |
          echo "🔐 Syncing secrets from GCP Secret Manager to Kubernetes..."
          
          # List of secrets to sync (format: k8s-secret-name=GCP_SECRET_NAME)
          SECRETS=(
            "redis-url=REDIS_URL"
            "postgres-url=POSTGRES_URL"
            "supabase-url=SUPABASE_URL"
            "supabase-service-role-key=SUPABASE_SERVICE_ROLE_KEY"
            "tavily-api-key=TAVILY_API_KEY"
            "composio-api-key=COMPOSIO_API_KEY"
            "gemini-api-key=GEMINI_API_KEY"
            "google-api-key=GOOGLE_API_KEY"
          )
          
          for SECRET_MAPPING in "${SECRETS[@]}"; do
            K8S_NAME="${SECRET_MAPPING%=*}"
            GCP_NAME="${SECRET_MAPPING#*=}"
            
            echo "  Syncing $GCP_NAME -> $K8S_NAME..."
            
            # Fetch secret value from GCP
            SECRET_VALUE=$(gcloud secrets versions access latest --secret="$GCP_NAME" --project=${{ env.PROJECT_ID }})
            
            # Delete existing K8s secret if it exists
            kubectl delete secret "$K8S_NAME" -n doot-agent 2>/dev/null || true
            
            # Create K8s secret
            kubectl create secret generic "$K8S_NAME" \
              -n doot-agent \
              --from-literal=latest="$SECRET_VALUE"
          done
          
          echo "✅ All secrets synced successfully"

      - name: Deploy agent-platform
        if: |
          needs.build-agent-platform.result == 'success' &&
          (github.event.inputs.service == 'all' || 
           github.event.inputs.service == 'agent-platform' ||
           github.event_name == 'push')
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: agent-platform
            namespace: doot-agent
            labels:
              app: agent-platform
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: agent-platform
            template:
              metadata:
                labels:
                  app: agent-platform
              spec:
                serviceAccountName: agent-platform
                containers:
                - name: agent-platform
                  image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/agent-platform:${{ github.sha }}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 5000
                  env:
                  - name: ORBIT_AGENT_ROOT
                    value: "/app"
                  - name: IN_DOCKER
                    value: "true"
                  - name: ENV_MODE
                    value: "production"
                  - name: BROWSER_WSS_URL
                    value: "ws://browser-manager.doot-agent.svc.cluster.local:8000"
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: redis-url
                        key: latest
                  - name: POSTGRES_URL
                    valueFrom:
                      secretKeyRef:
                        name: postgres-url
                        key: latest
                  - name: SUPABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: supabase-url
                        key: latest
                  - name: SUPABASE_SERVICE_ROLE_KEY
                    valueFrom:
                      secretKeyRef:
                        name: supabase-service-role-key
                        key: latest
                  - name: TAVILY_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: tavily-api-key
                        key: latest
                  - name: COMPOSIO_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: composio-api-key
                        key: latest
                  - name: GEMINI_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: gemini-api-key
                        key: latest
                  - name: GOOGLE_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: google-api-key
                        key: latest
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "250m"
                    limits:
                      memory: "1Gi"
                      cpu: "500m"
                  livenessProbe:
                    httpGet:
                      path: /
                      port: 5000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /
                      port: 5000
                    initialDelaySeconds: 10
                    periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: agent-platform
            namespace: doot-agent
          spec:
            selector:
              app: agent-platform
            ports:
            - port: 5000
              targetPort: 5000
            type: LoadBalancer
          EOF
          
          echo "⏳ Waiting for agent-platform deployment (timeout: 10m)..."
          if ! kubectl rollout status deployment/agent-platform -n doot-agent --timeout=10m; then
            echo "❌ Deployment failed! Checking pod status..."
            kubectl get pods -n doot-agent -l app=agent-platform
            echo ""
            echo "Pod logs:"
            kubectl logs -n doot-agent -l app=agent-platform --tail=100 || true
            echo ""
            echo "Pod events:"
            kubectl describe pods -n doot-agent -l app=agent-platform || true
            exit 1
          fi
          echo "✅ Agent-platform deployed successfully"
          
          # Get service URL immediately
          echo ""
          echo "🌐 Getting agent-platform URL..."
          for i in {1..30}; do
            AGENT_IP=$(kubectl get service agent-platform -n doot-agent -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$AGENT_IP" ]; then
              echo "✅ Agent Platform API: http://$AGENT_IP:5000"
              echo "   Health: http://$AGENT_IP:5000/"
              echo "   Docs: http://$AGENT_IP:5000/docs"
              break
            fi
            echo "   Waiting for external IP... ($i/30)"
            sleep 2
          done

      - name: Verify deployments
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n doot-agent
          
          echo ""
          echo "=== Deployments ==="
          kubectl get deployments -n doot-agent
          
          echo ""
          echo "=== Services ==="
          kubectl get services -n doot-agent
          
          echo ""
          echo "======================================"
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "======================================"
          echo ""
          
          # Get browser-manager URL
          BROWSER_IP=$(kubectl get service browser-manager -n doot-agent -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -n "$BROWSER_IP" ]; then
            echo "🌐 Browser Manager:"
            echo "   URL: http://$BROWSER_IP:8000"
            echo "   Health: http://$BROWSER_IP:8000/health"
            echo "   Docs: http://$BROWSER_IP:8000/docs"
          else
            echo "🌐 Browser Manager: (pending external IP...)"
            echo "   kubectl port-forward -n doot-agent svc/browser-manager 8000:8000"
          fi
          
          echo ""
          
          # Get agent-platform URL
          AGENT_IP=$(kubectl get service agent-platform -n doot-agent -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -n "$AGENT_IP" ]; then
            echo "🚀 Agent Platform (MAIN BACKEND):"
            echo "   URL: http://$AGENT_IP:5000"
            echo "   Health: http://$AGENT_IP:5000/"
            echo "   Docs: http://$AGENT_IP:5000/docs"
          else
            echo "🚀 Agent Platform: (pending external IP...)"
            echo "   kubectl port-forward -n doot-agent svc/agent-platform 5000:5000"
          fi
          
          echo ""
          echo "======================================"
          echo "📊 Resource Usage:"
          kubectl top pods -n doot-agent 2>/dev/null || echo "  Metrics not available yet"
          echo "======================================"

  # Job 5: Health checks
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy-to-k8s
    if: needs.deploy-to-k8s.result == 'success'
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Port-forward and test browser-manager
        run: |
          # Port forward in background
          kubectl port-forward -n doot-agent svc/browser-manager 8000:8000 &
          PF_PID=$!
          
          # Wait for port-forward to be ready
          sleep 5
          
          # Test health endpoint
          for i in {1..5}; do
            if curl -f http://localhost:8000/health; then
              echo "✓ Browser Manager is healthy"
              kill $PF_PID
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          
          kill $PF_PID
          echo "✗ Health check failed"
          exit 1

      - name: Display deployment summary
        if: always()
        run: |
          echo "=== Final Deployment Status ==="
          kubectl get all -n doot-agent
          
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n doot-agent --sort-by='.lastTimestamp' | tail -20
