[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform"
version = "0.1.0"
description = "Orbit Agent Platform API service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
  "watchfiles>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
